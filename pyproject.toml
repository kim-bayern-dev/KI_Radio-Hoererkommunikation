[project]
name = "radiobrain"
version = "0.1.0"
description = "KI gestützte Vollautomatisierte Hörerkommunikation"
authors = [
    {name = "Tobias Sterbak [hello@tobiassterbak.com]"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.12,<4.0"
package-mode = false
dependencies = [
    "lancedb (>=0.21.2,<0.22.0)",
    "langchain (>=0.3.23,<0.4.0)",
    "langchain-ollama (>=0.3.1,<0.4.0)",
    "gradio (>=6.0.0,<6.11.0)",
    "openai (>=1.72.0,<2.0.0)",
    "langchain-openai (>=0.3.12,<0.4.0)",
    "pyarrow (>=19.0.1,<20.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pre-commit (>=4.2.0,<5.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "langchain-community (>=0.3.23,<0.4.0)",
    "jsonlines (>=4.0.0,<5.0.0)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "metaphone (>=0.6,<0.7)",
    "networkx (>=3.5,<4.0)",
    "rapidfuzz (>=3.13.0,<4.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "ruff (>=0.14.7,<0.15.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"